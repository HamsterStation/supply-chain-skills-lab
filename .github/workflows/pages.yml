name: Publish learning site
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements-dev.txt
      - run: python -m scripts.validate.content
      - run: pytest -q
      - run: node --test auth-worker/test/*.test.mjs
      - run: npm ci --prefix auth-worker
      - run: npm run test:runtime --prefix auth-worker
      - run: python -m scripts.collect.checkpoint
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - run: python -m scripts.generate.bundle
      - run: npm ci --prefix frontend
      - run: npm run build --prefix frontend
        env:
          VITE_AUTH_URL: ${{ vars.AUTH_SERVICE_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
