name: Check deployed login service
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check real HTTPS service and anonymous access boundaries
        run: python scripts/setup/check_deployment.py
        env:
          AUTH_SERVICE_URL: ${{ vars.AUTH_SERVICE_URL }}
